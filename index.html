<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Mahasiswa</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f9fff9;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      text-align: center;
      padding: 30px;
      width: 320px;
      border-top: 6px solid #7ed957; /* hijau muda */
    }

    .card img {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #7ed957;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 22px;
      margin: 5px 0;
      color: #333;
    }

    .card p {
      color: #666;
      font-size: 16px;
      margin: 5px 0;
    }

    .footer {
      margin-top: 15px;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="rendi.jpeg" alt="Foto Profil">
    <h2>Muhamad Rendi Maulana</h2>
    <p><strong>NIM:</strong> 222611008</p>
    <div class="footer">Mahasiswa Universitas Ma'soem</div>
  </div>

</body>
</html>
